<!DOCTYPE html>
<html lang="gu">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="connect-src 'self' http://localhost:5080 http://127.0.0.1:5080">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>ND Finance</title>
  <script>
    // Enforce permanent HTTPS in production; never disable even during high traffic surges
    (function enforcePermanentHttps() {
      if (window.location.protocol === 'http:' && !['localhost', '127.0.0.1', '::1', '[::1]'].includes(window.location.hostname)) {
        window.location.replace(window.location.href.replace(/^http:/, 'https:'));
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #fbf7ec;
      --bg-panel: #ffffff;
      --bg-panel-2: #f7efd9;
      --line: #e6d9b0;
      --gold: #D4AF37;
      --gold-light: #E9CE72;
      --gold-deep: #8C6D1F;
      --cream: #2b2411;
      --muted: #8a7f66;
      --danger: #C1443A;
      --danger-light: #a8362b;
      --active: #C9A227;
      --closed: #c9c2ac;
      --radius: 14px;
      --font-display: 'Cinzel', serif;
      --font-guj: 'Noto Sans Gujarati', sans-serif;
      --font-body: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% -10%, #fff6dd 0%, #fbf7ec 55%), var(--bg);
      color: var(--cream);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .guj {
      font-family: var(--font-guj);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input,
    select {
      font-family: inherit;
    }

    /* ---------- Scrollbar ---------- */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gold-deep);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    /* ---------- Ornamental helpers ---------- */
    .gold-rule {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold-light) 50%, var(--gold) 80%, transparent);
      opacity: .7;
    }

    .coin {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, var(--gold-light), var(--gold) 55%, var(--gold-deep) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px var(--gold-deep), 0 4px 10px rgba(140, 109, 31, .25);
      color: #2a2007;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    /* ---------- Control hover and focus transitions ---------- */
    .btn,
    .btn-gold,
    .btn-outline,
    .icon-btn,
    .tab-btn,
    .nav-item,
    .burger {
      transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease, color .15s ease, opacity .15s ease;
      will-change: transform;
    }

    .btn-primary:hover,
    .btn-gold:hover {
      box-shadow: 0 10px 22px rgba(212, 175, 55, .35);
      transform: translateY(-1px);
    }

    .btn-ghost:hover,
    .btn-outline:hover {
      background: rgba(212, 175, 55, .08);
    }

    .btn-danger:hover {
      background: rgba(193, 68, 58, .08);
    }

    .icon-btn:hover {
      background: #f6eed2;
    }

    .stat-box,
    tr.rowclick td {
      transition: transform .18s ease, box-shadow .18s ease, background-color .12s ease;
    }

    .stat-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(140, 109, 31, .14);
    }

    .panel,
    .modal,
    .auth-card {
      transform-origin: center;
    }

    /* ================= AUTH SCREEN ================= */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .brand-block {
      text-align: center;
      margin-bottom: 26px;
    }

    .shree-line {
      font-family: var(--font-guj);
      color: var(--gold-deep);
      font-size: 15px;
      position: relative;
      top: -2px;
      letter-spacing: .5px;
      margin-bottom: 10px;
      opacity: .92;
    }

    .brand-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: var(--font-display);
      font-size: clamp(24px, 5vw, 34px);
      letter-spacing: 2px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-deep));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 1px 0 rgba(0, 0, 0, .08);
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .auth-card {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      min-height: 460px;
      background: linear-gradient(145deg, #ffffff, #fdf6df);
      border: 1px solid var(--line);
      border-radius: 20px;
      position: relative;
      display: flex;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(212, 175, 55, .15), 0 30px 60px rgba(140, 109, 31, .12);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(212, 175, 55, .30);
      border-radius: 14px;
      pointer-events: none;
    }

    .auth-visual {
      flex: 1.1;
      background:
        radial-gradient(circle at 30% 20%, rgba(212, 175, 55, .25), transparent 55%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 55, .16), transparent 50%),
        linear-gradient(160deg, #fffaea, #f7ecc4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      gap: 18px;
      border-right: 1px solid var(--line);
      position: relative;
    }

    .auth-visual .big-coin {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, var(--gold-light), var(--gold) 55%, var(--gold-deep) 100%);
      box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--gold-deep), 0 10px 30px rgba(212, 175, 55, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 34px;
      color: #2a2007;
      font-weight: 700;
    }

    .auth-visual h2 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--gold-deep);
      text-align: center;
      font-size: 20px;
      margin: 0;
    }

    .auth-visual p {
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.6;
      max-width: 280px;
      margin: 0;
    }

    .auth-form-side {
      flex: 1;
      padding: 34px 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .tab-row {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
      background: var(--bg-panel-2);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .5px;
    }

    .tab-btn.on {
      background: linear-gradient(180deg, var(--gold-light), var(--gold));
      color: #241b04;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: .6px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .field input {
      width: 100%;
      padding: 11px 12px;
      background: #fffdf5;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--cream);
      font-size: 14px;
      outline: none;
      transition: .15s;
    }

    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, .16);
    }

    .field input:disabled {
      opacity: .7;
      background: #f4efdd;
    }

    .btn-gold {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 9px;
      margin-top: 6px;
      background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, var(--gold-deep));
      color: #221a05;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .5px;
      box-shadow: 0 6px 16px rgba(212, 175, 55, .28);
    }

    .btn-gold:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .btn-outline {
      padding: 11px 14px;
      border-radius: 9px;
      background: transparent;
      border: 1px solid var(--gold-deep);
      color: var(--gold-deep);
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
    }

    .btn-outline-full {
      width: 100%;
      margin-top: 8px;
    }

    .auth-err {
      color: var(--danger-light);
      font-size: 12.5px;
      margin: 6px 0 0;
      min-height: 16px;
    }

    .auth-msg {
      color: var(--gold-deep);
      font-size: 12.5px;
      margin: 6px 0 0;
      min-height: 16px;
    }

    @media (max-width:720px) {
      .auth-card {
        flex-direction: column;
        aspect-ratio: auto;
        min-height: 0;
      }

      .auth-visual {
        display: none;
      }

      .auth-form-side {
        padding: 26px 20px;
      }
    }

    /* ================= APP SHELL ================= */
    .app-shell {
      display: none;
      min-height: 100vh;
    }

    .app-shell.show {
      display: flex;
    }

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #ffffff, #faf3da);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 40;
      transform: translateX(0);
      transition: transform .25s ease;
    }

    .sidebar-head {
      padding: 20px 18px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head .name {
      font-family: var(--font-display);
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--gold-deep);
      line-height: 1.25;
    }

    .sidebar-head .name small {
      display: block;
      font-family: var(--font-body);
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 2px;
    }

    .dash-card {
      margin: 16px;
      padding: 14px;
      background: var(--bg-panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .dash-shop {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .shop-logo {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      object-fit: cover;
      border: 1px solid var(--gold-deep);
      background: #fffdf5;
    }

    .shop-logo-ph {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      border: 1px dashed var(--gold-deep);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-deep);
      font-size: 17px;
      background: #fffdf5;
    }

    .shop-name-txt {
      font-size: 13px;
      font-weight: 600;
      color: var(--cream);
    }

    .shop-name-sub {
      font-size: 10.5px;
      color: var(--muted);
    }

    .dash-stats {
      display: flex;
      gap: 8px;
    }

    .dash-stat {
      flex: 1;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 8px;
      text-align: center;
    }

    .dash-stat .num {
      font-family: var(--font-display);
      font-size: 19px;
      color: var(--gold-deep);
    }

    .dash-stat .lbl {
      font-size: 9.5px;
      color: var(--muted);
      letter-spacing: .4px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .nav-section-lbl {
      padding: 14px 20px 6px;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: var(--gold-deep);
      text-transform: uppercase;
      font-weight: 700;
    }

    .nav-items {
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .nav-item .ic {
      width: 20px;
      text-align: center;
      font-size: 15px;
    }

    .nav-item:hover {
      background: #f6eed2;
      color: var(--cream);
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(212, 175, 55, .20), transparent);
      color: var(--gold-deep);
      box-shadow: inset 3px 0 0 var(--gold);
    }

    .nav-divider {
      height: 1px;
      background: var(--line);
      margin: 12px 16px;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding: 10px;
    }

    .sidebar-scrim {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(40, 34, 10, .35);
      z-index: 35;
    }

    .sidebar-scrim.show {
      display: block;
    }

    .main-col {
      flex: 1;
      margin-left: 270px;
      min-width: 0;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .burger {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      background: var(--bg-panel-2);
      border: 1px solid var(--line);
      color: var(--gold-deep);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .burger-lines {
      width: 18px;
      height: 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .burger-lines span {
      display: block;
      width: 100%;
      height: 2px;
      border-radius: 99px;
      background: var(--gold-deep);
      transition: transform .2s ease, opacity .2s ease;
    }

    .burger.open .burger-lines span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .burger.open .burger-lines span:nth-child(2) {
      opacity: 0;
    }

    .burger.open .burger-lines span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .topbar-titles {
      flex: 1;
      min-width: 0;
    }

    .topbar-shree {
      font-family: var(--font-guj);
      font-size: 12px;
      color: var(--gold-deep);
      opacity: .9;
    }

    .topbar-screen {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .storage-status {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--bg-panel-2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-deep);
      font-size: 15px;
    }

    .content {
      padding: 22px 24px 60px;
      max-width: 1180px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: 22px;
      color: var(--gold-deep);
      letter-spacing: .5px;
      margin: 0 0 4px;
    }

    .page-sub {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 20px;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 2px 14px rgba(140, 109, 31, .06);
    }

    .panel h3 {
      font-family: var(--font-display);
      font-size: 15px;
      color: var(--gold-deep);
      margin: 0 0 14px;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 14px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px 14px;
    }

    @media (max-width:640px) {

      .grid2,
      .grid3 {
        grid-template-columns: 1fr;
      }
    }

    .f label {
      display: block;
      font-size: 11px;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .f input,
    .f select {
      width: 100%;
      padding: 10px 11px;
      background: #fffdf5;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--cream);
      font-size: 13.5px;
      outline: none;
    }

    .f input:focus,
    .f select:focus {
      border-color: var(--gold);
    }

    .row-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .btn {
      padding: 10px 18px;
      border-radius: 9px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: .3px;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn-primary {
      background: linear-gradient(180deg, var(--gold-light), var(--gold) 60%, var(--gold-deep));
      color: #221a05;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--gold-deep);
      color: var(--gold-deep);
    }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger-light);
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 7px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 9px 10px;
      color: var(--gold-deep);
      font-size: 10.5px;
      letter-spacing: .6px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--line);
    }

    td {
      padding: 10px 10px;
      border-bottom: 1px solid #f1e8cc;
      color: var(--cream);
    }

    tr.rowclick {
      cursor: pointer;
    }

    tr.rowclick:hover td {
      background: #faf3de;
    }

    .tag {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .3px;
    }

    .tag-active {
      background: rgba(201, 162, 39, .15);
      color: var(--gold-deep);
      border: 1px solid var(--gold-deep);
    }

    .tag-closed {
      background: rgba(138, 127, 102, .14);
      color: var(--muted);
      border: 1px solid var(--line);
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-bar input {
      flex: 1;
      padding: 11px 14px;
      background: #fffdf5;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--cream);
      font-size: 13.5px;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      padding: 26px 10px;
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 10px;
    }

    .modal-back {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 24, 8, .45);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-back.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 460px;
      background: var(--bg-panel);
      border: 1px solid var(--gold-deep);
      border-radius: 16px;
      padding: 22px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(140, 109, 31, .25);
    }

    .modal h3 {
      font-family: var(--font-display);
      color: var(--gold-deep);
      margin: 0 0 14px;
      font-size: 17px;
    }

    .modal-close {
      float: right;
      background: none;
      border: none;

<body>

  <div id="root"></div>
  <div class="toast" id="toast"></div>

  <script>
    /* ================= STORAGE HELPERS ================= */
    const SKEY = { LOANS: 'ndf_loans', COUNTER: 'ndf_counter', SHOP: 'ndf_shop' };
    const API_STORAGE = '/api/storage/';

    async function apiRequest(path, options = {}) {
      let baseUrl = '';
      if (
        window.location.protocol === 'http:' &&
        ['localhost', '127.0.0.1', '::1', '[::1]'].includes(window.location.hostname) &&
        window.location.port !== '5080'
      ) {
        const backendHost = ['::1', '[::1]'].includes(window.location.hostname)
          ? 'localhost'
          : window.location.hostname;
        baseUrl = `http://${backendHost}:5080`;
      }
      const url = baseUrl + path;
      let response;
      response = await fetch(url, {
        ...options,
        credentials: 'include',
        headers: {
          'X-Requested-With': 'XMLHttpRequest',
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });
      const text = await response.text();
      let result = {};
      try { result = text ? JSON.parse(text) : {}; } catch (_) { result = {}; }
      if (!response.ok) {
        if (response.status === 401 && !path.endsWith('/auth/login') && !path.endsWith('/auth/login/mfa')) {
          expireSession();
        }
        throw new Error(result.error || result.detail || (response.status === 401
          ? 'Your session has expired. Please sign in again.'
          : response.status === 429 ? 'Too many requests. Please wait and try again.'
            : `Request failed (${response.status}).`));
      }
      return result;
    }

    function expireSession(notify = false) {
      clearTimeout(state.sessionTimer);
      state.sessionTimer = null;
      const wasLoggedIn = !!state.currentUser;
      state.currentUser = null;
      state.users = [];
      state.loans = [];
      if (wasLoggedIn || notify) {
        state.authError = 'Your session has expired. Please sign in again.';
      }
      render();
    }

    function scheduleSessionExpiration(expiresAt) {
      clearTimeout(state.sessionTimer);
      const remaining = Date.parse(expiresAt) - Date.now();
      state.sessionTimer = setTimeout(expireSession, Math.max(0, remaining));
    }

    async function sGet(key) {
      const result = await apiRequest(API_STORAGE + encodeURIComponent(key));
      return JSON.parse(result.value);
    }
    async function sSet(key, value) {
      try {
        const serialized = JSON.stringify(value);
        await apiRequest(API_STORAGE + encodeURIComponent(key), {
          method: 'PUT', body: JSON.stringify({ value: serialized })
        });
        return true;
      } catch (e) {
        console.error('Secure storage request failed:', e);
        toast(e.message);
        return false;
      }
    }

    /* ================= APP STATE ================= */
    function getSavedUsername() {
      try {
        let legacyUsername = '';
        try {
          legacyUsername = JSON.parse(localStorage.getItem('ndf_saved_credentials') || '{}').username || '';
        } catch (_) { }
        const username = localStorage.getItem('ndf_saved_username') || legacyUsername;
        localStorage.removeItem('ndf_saved_credentials');
        localStorage.removeItem('ndf_saved_accounts');
        if (username) localStorage.setItem('ndf_saved_username', username);
        return username;
      } catch (_) { return ''; }
    }

    function saveUsernameLocally(username) {
      try {
        if (username) localStorage.setItem('ndf_saved_username', username);
        localStorage.removeItem('ndf_saved_credentials');
        localStorage.removeItem('ndf_saved_accounts');
      } catch (_) { }
    }

    getSavedUsername();

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
      state.passwordInputVisible = input.type === 'text';
      const btn = document.getElementById(inputId + '_toggle');
      if (btn) btn.textContent = input.type === 'password' ? '👁️ Show' : '🙈 Hide';
    }

    function copyToClipboard(text, label = 'Copied') {
      if (!text) { toast('No value to copy'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => toast(`${label} copied!`)).catch(() => {
          fallbackCopy(text, label);
        });
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        toast(`${label} copied!`);
      } catch (_) {
        toast(`Could not copy automatically`);
      }
      document.body.removeChild(ta);
    }

    let state = {
      users: [],
      loans: [],
      counter: 1,
      shop: { name: '', mobile: '', email: '', city: '', logo: '' },
      currentUser: null,
      screen: 'dashboard',
      sidebarOpen: false,
      bootstrapAvailable: false,
      authError: '',
      authMsg: '',
      searchQuery: '',
      closeSelectedId: null,
      closeDate: '',
      closeCalc: null,
      statementLoanId: null,
      yearFilter: financialYearOf(new Date()),
      viewLoan: null,
      ownerSelectedUser: null,
      ownerDeletingUser: null,
      ownerTab: 'users',
      ownerUserLoanFilter: 'active',
      ownerSearch: '',
      ownerClientFilter: 'all',
      ownerClientSearch: '',
      showCreateClientModal: false,
      passwordInputVisible: false,
      showForgotPassword: false,
      forgotPasswordUser: '',
      forgotPasswordOtpSent: false,
      localPasswordReset: false,
      mfaChallengeId: '',
      mfaEnabled: false,
      pendingMfaSecret: '',
      sessionTimer: null,
      showProfileModal: false,
      showSettingsModal: false,
    };

    function userLoans() {
      if (!state.currentUser) return [];
      if (isOwner()) return state.loans;
      const username = state.currentUser.username;
      return state.loans.filter(l => l.owner === username || (!l.owner && l.createdBy === username));
    }

    function isOwner() {
      return Boolean(state.currentUser?.isOwner ?? state.currentUser?.IsOwner);
    }

    function loansForUsername(username) {
      return state.loans.filter(l => l.owner === username || (!l.owner && l.createdBy === username));
    }

    function earnedInterestForMonth(loans, now = new Date()) {
      const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
      const monthEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);

      return loans.reduce((total, loan) => {
        const isActive = loan.status === 'active';
        const isClosed = loan.status === 'closed' && loan.closeDate;
        if (!isActive && !isClosed) return total;

        const loanStart = new Date(loan.startDate);
        const loanEnd = isActive ? monthEnd : new Date(loan.closeDate);
        if (Number.isNaN(loanStart.getTime()) || Number.isNaN(loanEnd.getTime())) return total;

        const periodStart = loanStart > monthStart ? loanStart : monthStart;
        const periodEnd = loanEnd < monthEnd ? loanEnd : monthEnd;
        if (periodEnd <= periodStart) return total;

        return total + calcInterestDetailed(
          Number(loan.amount),
          Number(loan.rate),
          periodStart,
          periodEnd
        ).totalInterest;
      }, 0);
    }

    function ownerDataIssues() {
      const issues = [];
      const seenUsers = new Set();
      state.users.forEach(user => {
        if (!user.username || !user.email) issues.push(`Account with missing login data${user.username ? `: ${user.username}` : ''}`);
        if (user.username && seenUsers.has(user.username)) issues.push(`Duplicate username: ${user.username}`);
        if (user.username) seenUsers.add(user.username);
        if (!user.isOwner && (!user.shopName || !user.mobile || !user.city)) issues.push(`Incomplete profile: ${user.username || 'unknown account'}`);
      });
      const seenLoans = new Set();
      state.loans.forEach(loan => {
        if (!loan.id || seenLoans.has(loan.id)) issues.push(`Duplicate or missing loan ID: ${loan.id || 'unknown'}`);
        if (loan.id) seenLoans.add(loan.id);
        if (!loan.owner && !loan.createdBy) issues.push(`Loan without owner: ${loan.id || 'unknown'}`);
        if (!Number.isFinite(Number(loan.amount)) || Number(loan.amount) < 0) issues.push(`Invalid principal: ${loan.id || 'unknown'}`);
        if (loan.owner && !state.users.some(user => user.username === loan.owner)) issues.push(`Loan owner not found: ${loan.id || 'unknown'}`);
      });
      return issues;
    }

    function shopForUser(user) {
      return {
        name: user.shopName || state.shop.name || '',
        ownerName: user.ownerName || user.shopOwnerName || '',
        mobile: user.mobile || state.shop.mobile || '',
        email: user.email || state.shop.email || '',
        city: user.city || state.shop.city || '',
        logo: user.shopLogo || state.shop.logo || ''
      };
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      clearTimeout(window.__toastT);
      t.classList.add('show');
      window.__toastT = setTimeout(() => t.classList.remove('show'), 3200);
    }

    async function loadAll() {
      try {
        const bootstrap = await apiRequest('/api/auth/bootstrap/status');
        state.bootstrapAvailable = bootstrap.available;
        if (state.bootstrapAvailable) {
          state.currentUser = null;
          state.authError = '';
          render();
          return;
        }
        const auth = await apiRequest('/api/auth/me');
        state.currentUser = auth.user;
        state.mfaEnabled = auth.mfaEnabled;
        scheduleSessionExpiration(auth.expiresAt);
        const [users, loans, counter] = await Promise.all([
          apiRequest('/api/auth/users'),
          sGet(SKEY.LOANS),
          sGet(SKEY.COUNTER)
        ]);
        state.users = users;
        state.loans = loans;
        state.counter = counter;
        state.shop = isOwner()
          ? await sGet(SKEY.SHOP)
          : shopForUser(state.currentUser);
        state.authError = '';
      } catch (error) {
        state.currentUser = null;
        if (error.message.includes('session has expired') || error.message.includes('unauthorized') || error.message.includes('401')) {
          state.authError = '';
        } else {
          state.authError = error.message;
        }
      }
      render();
    }

    /* ================= INTEREST CALCULATION =================
       Walks month by month between start and end date.
       For each calendar-month segment: interest = principal * (rate/100) * (daysInSegment / daysInThatCalendarMonth)
       This naturally accounts for 28/29/30/31-day months instead of a flat 30-day assumption. */
    function calcInterestDetailed(principal, monthlyRatePct, startDate, endDate) {
      let cursor = new Date(startDate);
      const end = new Date(endDate);
      if (!Number.isFinite(principal) || !Number.isFinite(monthlyRatePct) || Number.isNaN(cursor.getTime()) || Number.isNaN(end.getTime()) || end <= cursor) {
        return { totalDays: 0, totalInterest: 0, segments: [] };
      }
      let totalInterest = 0;
      let totalDays = 0;
      const segments = [];
      while (cursor < end) {
        const y = cursor.getFullYear(), m = cursor.getMonth();
        const daysInMonth = new Date(y, m + 1, 0).getDate();
        const nextMonthStart = new Date(y, m + 1, 1);
        const segEnd = nextMonthStart < end ? nextMonthStart : end;
        const segDays = Math.round((segEnd - cursor) / 86400000);
        const segInterest = principal * (monthlyRatePct / 100) * (segDays / daysInMonth);
        segments.push({ month: `${y}-${String(m + 1).padStart(2, '0')}`, daysInMonth, segDays, segInterest });
        totalInterest += segInterest;
        totalDays += segDays;
        cursor = segEnd;
      }
      return { totalDays, totalInterest, segments };
    }

    function fmtMoney(n) {
      return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
    }
    function fmtDate(d) {
      if (!d) return '-';
      const dt = new Date(d);
      return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function fmtDateTime(d) {
      if (!d) return '-';
      const dt = new Date(d);
      return dt.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    /* ================= RENDER ROOT ================= */
    function render() {
      const root = document.getElementById('root');
      if (!state.currentUser) {
        root.innerHTML = renderAuth();
      } else {
        root.innerHTML = renderApp();
      }
    }

    /* ================= AUTH SCREEN ================= */
    function renderAuth() {
      if (state.bootstrapAvailable) return renderOwnerBootstrap();
      return `
  <div class="auth-wrap">
    <div class="brand-block">
      <div class="shree-line guj">|| શ્રી માં ક્ષેમંકરી કૃપા ||</div>
      <div class="brand-title"><span class="coin">ND</span> ND FINANCE </div>
      <div class="brand-sub">  · Loan & Finance Data Management</div>
    </div>
    <div class="auth-card">

        <div class="big-coin">₹</div>
        <h2>YOUR DIGITAL FINANCE DATA MANAGER</h2>
        <p>Securely manage your loans , item pledges , interest calculations and  statements — All data in one place.</p>
        <div class="gold-rule" style="width:70%"></div>

      </div>

        ${renderLoginForm()}

  </div>`;
    }

    function renderOwnerBootstrap() {
      return `

    </div>

      <div class="auth-form-side">

        <div class="field"><label>Owner name</label><input id="ob_owner" type="text" value="ND Finance Owner"></div>

        <div class="field"><label>Email address</label><input id="ob_email" type="email" autocomplete="email" placeholder="you@example.com"></div>
        <div class="field"><label>Password (12 characters minimum)</label><input id="ob_password" type="password" autocomplete="new-password" placeholder="Create a strong password"></div>
        <button class="btn-gold" id="ob_create" onclick="createFirstOwner()">Create Owner Account</button>
        <div class="auth-err">${escapeHtml(state.authError || '')}</div>
      </div>

    }

    async function createFirstOwner() {
      const username = val('ob_user');
      const ownerName = val('ob_owner');
      const shopName = val('ob_shop');
      const city = val('ob_city');
      const mobile = val('ob_mobile');
      const email = val('ob_email').toLowerCase();
      const password = document.getElementById('ob_password')?.value ?? '';
      const showError = message => {
        state.authError = message;
        const errorElement = document.querySelector('.auth-err');
        if (errorElement) errorElement.textContent = message;
      };

      if (!username || !ownerName || !shopName || !city || !mobile || !email || !password) {
        showError('Complete all required fields.'); return;
      }
      if (!isValidEmail(email)) { showError('Enter a valid email address.'); return; }
      if (!isValidMobile(mobile)) { showError('Mobile number must be exactly 10 digits.'); return; }
      if (password.length < 12 || password.length > 256) {
        showError('Use a password between 12 and 256 characters.'); return;
      }
      const button = document.getElementById('ob_create');
      if (button) { button.disabled = true; button.textContent = 'Creating...'; }
      try {
        await apiRequest('/api/auth/bootstrap', {
          method: 'POST',
          body: JSON.stringify({ username, password, email, ownerName, shopName, city, mobile, shopLogo: '' })
        });
        state.bootstrapAvailable = false;
        state.authError = '';
        await loadAll();
      } catch (error) {
        if (button) { button.disabled = false; button.textContent = 'Create Owner Account'; }
        showError(error.message);
      }
    }

    function isValidMobile(m) { return /^\d{10}$/.test(m); }
    function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

    function openForgotPassword(username = '') {

      state.forgotPasswordUser = username;

    async function resetLocalOwnerPassword() {
      const error = document.getElementById('fp_local_error');
      const username = val('fp_local_user');
      const newPassword = document.getElementById('fp_local_new')?.value ?? '';
      const confirmPassword = document.getElementById('fp_local_confirm')?.value ?? '';
      if (!username) { error.textContent = 'Enter the owner username.'; return; }
      if (newPassword.length < 12 || newPassword.length > 256) {
        error.textContent = 'Use a password between 12 and 256 characters.'; return;
      }
      if (newPassword !== confirmPassword) { error.textContent = 'Passwords do not match.'; return; }
      try {
        await apiRequest('/api/auth/password/reset-local', {
          method: 'POST', body: JSON.stringify({ usernameOrEmail: username, newPassword })
        });
        state.showForgotPassword = false;
        state.forgotPasswordUser = '';
        state.localPasswordReset = false;
        state.authError = '';
        await loadAll();
      } catch (requestError) { error.textContent = requestError.message; }
    }

    async function sendForgotOtp() {
      const username = (val('fp_user') || state.forgotPasswordUser).trim();
      const error = document.getElementById('fp_error');
      state.forgotPasswordUser = username;
      try {
        await apiRequest('/api/auth/password/reset/request', {
          method: 'POST', body: JSON.stringify({ usernameOrEmail: username })
        });
        state.forgotPasswordOtpSent = true;
        state.authError = '';
        render();
        toast('If the account exists, a reset code was sent to its registered email.');
      } catch (error) { document.getElementById('fp_error').textContent = error.message; }
    }

    async function resetUserPassword() {
      const error = document.getElementById('fp_error');
      const username = (val('fp_user') || state.forgotPasswordUser).trim();
      const code = val('fp_otp');
      const newPassword = val('fp_new');
      if (!/^\d{6}$/.test(code)) { error.textContent = 'Enter the 6-digit email code.'; return; }
      try {
        await apiRequest('/api/auth/password/reset', {
          method: 'POST', body: JSON.stringify({ usernameOrEmail: username, code, newPassword })
        });
      } catch (requestError) { error.textContent = requestError.message; return; }
      state.showForgotPassword = false;
      state.forgotPasswordUser = '';
      state.forgotPasswordOtpSent = false;
      state.authError = '';
      state.authMsg = 'Password reset successfully. You can now sign in.';
      render();
    }

    async function doLogin() {
      const u = document.getElementById('li_user').value.trim();
      const p = document.getElementById('li_pass').value;
      if (!u || !p) { state.authError = 'Please enter username and password.'; render(); return; }
      try {
        const result = await apiRequest('/api/auth/login', {
          method: 'POST', body: JSON.stringify({ username: u, password: p })
        });
        if (result.mfaRequired) {
          state.mfaChallengeId = result.challengeId;
          state.authError = '';
          render();
          return;
        }
        state.authError = '';
        state.authMsg = '';
        saveUsernameLocally(u);
        await loadAll();
        state.screen = isOwner() ? 'owner' : 'dashboard';
        render();
      } catch (error) {
        state.authError = error.message === 'Request failed (401).' ? 'Invalid username or password.' : error.message;
        render();
      }
    }

    async function verifyLoginMfa() {
      const code = val('li_mfa');
      try {
        await apiRequest('/api/auth/login/mfa', {
          method: 'POST', body: JSON.stringify({ challengeId: state.mfaChallengeId, code })
        });
        state.mfaChallengeId = '';
        await loadAll();
        state.screen = isOwner() ? 'owner' : 'dashboard';
        render();
      } catch (error) {
        state.authError = error.message === 'Request failed (401).' ? 'Invalid or expired authenticator code.' : error.message;
        render();
      }
    }

    async function createClientAccount() {
      const errorElement = document.getElementById('client_create_error');
      const button = document.getElementById('client_create_submit');
      const shopName = val('client_shop').trim();
      const ownerName = val('client_owner_name').trim();
      const city = val('client_city').trim();
      const mobile = val('client_mobile').trim();
      const email = val('client_email').trim();
      const username = val('client_user').trim();
      const membership = val('client_membership');
      const password = document.getElementById('client_password')?.value ?? '';

      if (!shopName || !ownerName || !city || !mobile || !email || !username || !password) {
        errorElement.textContent = 'Please fill in all required fields.';
        return;
      }
      if (!isValidMobile(mobile)) {
        errorElement.textContent = 'Mobile number must be exactly 10 digits.';
        return;
      }
      if (!isValidEmail(email)) {
        errorElement.textContent = 'Please enter a valid email address.';
        return;
      }
      if (password.length < 12 || password.length > 256) {
        errorElement.textContent = 'Use a password between 12 and 256 characters.';
        return;
      }

      button.disabled = true;
      button.textContent = 'Creating...';
      try {
        await apiRequest('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ username, password, shopName, ownerName, shopLogo: '', mobile, email, city, membership })
        });
      } catch (error) {
        errorElement.textContent = error.message;
        button.disabled = false;
        button.textContent = '＋ Create Client Account';
        return;
      }

      state.showCreateClientModal = false;
      try {
        state.users = await apiRequest('/api/auth/users');
        toast(`Client account ${username} created successfully.`);
      } catch (error) {
        toast(`Client account created, but the user list could not be refreshed: ${error.message}`);
      }
      render();
    }

    async function deleteOwnerClientAccount(username) {
      if (!isOwner() || state.ownerDeletingUser === username) return;
      const user = state.users.find(account =>
        account.username.toLowerCase() === String(username).toLowerCase()
      );
      if (!user || user.isOwner) {
        toast('Only a client account can be deleted by the owner.');
        return;
      }

      const linkedLoanCount = loansForUsername(user.username).length;
      const confirmed = window.confirm(
        `Permanently delete client account "${user.username}" and its ${linkedLoanCount} linked loan record(s)? This cannot be undone.`
      );
      if (!confirmed) return;

      state.ownerDeletingUser = user.username;
      render();
      try {
        await apiRequest(`/api/auth/users/${encodeURIComponent(user.username)}`, { method: 'DELETE' });
        state.users = state.users.filter(account =>
          account.username.toLowerCase() !== user.username.toLowerCase()
        );
        state.loans = state.loans.filter(loan => {
          const loanOwner = String(loan.owner || loan.createdBy || '');
          return loanOwner.toLowerCase() !== user.username.toLowerCase();
        });
        state.ownerSelectedUser = null;
        toast(`Client account "${user.username}" and its linked loans were permanently deleted.`);
      } catch (error) {
        toast(`Account deletion failed: ${error.message}`);
      } finally {
        state.ownerDeletingUser = null;
        render();
      }
    }

    function ownerUserSummary(user) {
      const loans = loansForUsername(user.username);
      const activeLoans = loans.filter(loan => loan.status === 'active');
      const closedLoans = loans.filter(loan => loan.status === 'closed');
      const activePrincipal = activeLoans.reduce((sum, loan) => sum + Number(loan.amount || 0), 0);
      const monthlyEarnedInterest = earnedInterestForMonth(loans);
      const todayStr = new Date().toISOString().split('T')[0];
      const activeAccruedInterest = activeLoans.reduce((sum, loan) => {
        const calc = calcInterestDetailed(loan.amount, loan.rate, loan.startDate, todayStr);
        return sum + (calc.totalInterest || 0);
      }, 0);
      return {
        loans,
        activeLoans,
        closedLoans,
        active: activeLoans.length,
        closed: closedLoans.length,
        activePrincipal,
        monthlyEarnedInterest,
        activeAccruedInterest,
        activeTotalDue: activePrincipal + activeAccruedInterest,
        principal: loans.reduce((sum, loan) => sum + Number(loan.amount || 0), 0),
        interest: loans.reduce((sum, loan) => sum + Number(loan.interest || 0), 0),
        issues: ownerDataIssues().filter(issue => issue.toLowerCase().includes((user.username || '').toLowerCase())).length
      };
    }

    async function submitNewLoan() {
      const name = val('nl_name'), city = val('nl_city'), mobile = val('nl_mobile'), address = val('nl_address');
      const aadhar = val('nl_aadhar'), weight = val('nl_weight'), itemName = val('nl_itemname'), itemType = val('nl_itemtype'), itemCode = val('nl_itemcode'), billNo = val('nl_billno');
      const amount = val('nl_amount'), metalrate = val('nl_metalrate'), rate = val('nl_rate');
      const start = val('nl_start') || currentLocalDateTime();

      if (!name || !city || !mobile || !address || !aadhar || !weight || !itemName || !itemType || !itemCode || !billNo || !amount || !rate) {
        toast('Please fill in all fields.'); return;
      }
      if (!Number.isFinite(Number(amount)) || Number(amount) <= 0) {
        toast('Principal must be a positive amount.'); return;
      }
      const btn = document.getElementById('nl_save_btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
      let jewelleryPhotos;
      try {
        jewelleryPhotos = (await Promise.all([1, 2, 3].map(index => readImageFile(document.getElementById(`nl_photo_${index}`)?.files[0])))).filter(Boolean);
      } catch (error) {
        if (btn) { btn.disabled = false; btn.textContent = 'Save Loan'; }
        toast('Could not read jewellery photo. Please choose the image again.');
        return;
      }
      let reservation;
      try {
        reservation = await apiRequest('/api/loans/next-id', { method: 'POST' });
      } catch (error) {
        if (btn) { btn.disabled = false; btn.textContent = 'Save Loan'; }
        toast(error.message || 'Could not reserve a loan ID.');
        return;
      }
      state.counter = reservation.counter;
      const loan = {
        id: reservation.id,
        billNo,
        name, city, mobile, address, aadhar,
        weight: Number(weight), itemName, itemCode, itemType, metalrate: metalrate === '' ? null : Number(metalrate),
        amount: Number(amount), rate: Number(rate),
        jewelleryPhotos,
        startDate: start,
        status: 'active',
        closeDate: null, interest: null, totalPayable: null,
        createdBy: state.currentUser.username,
        owner: state.currentUser.username,
        createdAt: new Date().toISOString()
      };
      state.loans.push(loan);
      const loansSaved = await sSet(SKEY.LOANS, state.loans);
      if (!loansSaved) {
        state.loans.pop();
        if (btn) { btn.disabled = false; btn.textContent = 'Save Loan'; }
        return;
      }
      toast(`Loan saved successfully!`);
      goScreen('dashboard');
    }

    function readImageFile(file) {
      if (!file) return Promise.resolve(null);
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = event => {
          const image = new Image();
          image.onload = () => {
            const maxSide = 1200;
            const scale = Math.min(1, maxSide / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
          };
          image.onerror = reject;
          image.src = event.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      const idx = state.loans.findIndex(x => x.id === id && (x.owner === state.currentUser.username || (!x.owner && x.createdBy === state.currentUser.username)));

      const l = state.loans[idx];
      const c = state.closeCalc;

      const previous = { status: l.status, closeDate: l.closeDate, interest: l.interest, totalPayable: l.totalPayable, closedBy: l.closedBy };
      l.status = 'closed';
      l.closeDate = state.closeDate;

      ` : ''}
      <div class="row-btns">
        <button class="btn btn-ghost btn-sm" onclick="openStatementDownloadOptions('${escapeAttrJs(l.id)}')">Download Bill</button>
      </div>
    </div>
  </div>`;
    }

    /* ================= YEARLY DATA ================= */
    function financialYearLabel(year) { return `${year}-${year + 1}`; }
    function financialYearOf(dateValue) {
      const date = new Date(dateValue);
      return date.getMonth() >= 3 ? date.getFullYear() : date.getFullYear() - 1;
    }

    function renderYearlyScreen() {
      const loans = userLoans();
      const years = Array.from(new Set(loans.flatMap(l => [financialYearOf(l.startDate), l.closeDate ? financialYearOf(l.closeDate) : null].filter(Boolean))));
      const curYear = financialYearOf(new Date());
      if (!years.includes(curYear)) years.push(curYear);
      years.sort((a, b) => b - a);

      const yr = state.yearFilter;
      const newLoans = loans.filter(l => financialYearOf(l.startDate) === yr);
      const closedLoans = loans.filter(l => l.status === 'closed' && l.closeDate && financialYearOf(l.closeDate) === yr);
      const yearLoans = [...new Map([...newLoans, ...closedLoans].map(l => [l.id, l])).values()];
      const newPrincipal = newLoans.reduce((s, l) => s + Number(l.amount || 0), 0);
      const closedPrincipal = closedLoans.reduce((s, l) => s + Number(l.amount || 0), 0);
      const totalInterest = closedLoans.reduce((s, l) => s + Number(l.interest || 0), 0);

      return `
    <h2 class="page-title">Total Data — Yearly</h2>
    <p class="page-sub">View and export all loan data for a specific year.</p>

    <div class="panel">
      <div class="grid2" style="align-items:end;">
        <div class="f"><label>Select Year</label>
          <select id="year_select" onchange="setYearFilter(this.value)">
            ${years.map(y => `<option value="${y}" ${y === yr ? 'selected' : ''}>${financialYearLabel(y)}</option>`).join('')}
          </select>
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn btn-primary" onclick="downloadYearCsv(${yr})">⬇ Download Year Data (CSV)</button>
        </div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="n">${yearLoans.length}</div><div class="l">TOTAL LOANS</div></div>
      <div class="stat-box"><div class="n">${newLoans.length}</div><div class="l">NEW DATA</div></div>
      <div class="stat-box"><div class="n">${closedLoans.length}</div><div class="l">CLOSED DATA</div></div>
      <div class="stat-box"><div class="n">${fmtMoney(newPrincipal)}</div><div class="l">NEW LOAN PRINCIPAL</div></div>
      <div class="stat-box"><div class="n">${fmtMoney(closedPrincipal)}</div><div class="l">CLOSED LOAN PRINCIPAL</div></div>
    </div>
    <div class="panel">
      <h3>💰 Interest Earned (${financialYearLabel(yr)})</h3>
      <div style="font-family:var(--font-display);font-size:22px;color:var(--gold-deep);">${fmtMoney(totalInterest)}</div>
    </div>

    ${renderYearlyLoanGroup(`New Data (${financialYearLabel(yr)})`, newLoans, 'No new loans for this financial year.')}
    ${renderYearlyLoanGroup(`Closed Data (${financialYearLabel(yr)})`, closedLoans, 'No loans closed in this financial year.')}
  `;
    }

    function renderYearlyLoanGroup(title, records, emptyText) {
      return `<div class="panel"><h3>${title}</h3>${records.length === 0 ? `<div class="empty">${emptyText}</div>` : `
    <div style="overflow-x:auto;"><table><thead><tr><th>Loan ID</th><th>Name</th><th>Item</th><th>Amount</th><th>Status</th><th>Start</th><th>Close</th></tr></thead><tbody>
      ${records.slice().sort((a, b) => new Date(b.closeDate || b.startDate) - new Date(a.closeDate || a.startDate)).map(l => `
        <tr class="rowclick" onclick="openLoanDetail('${escapeAttrJs(l.id)}')"><td>${escapeHtml(l.id)}${l.billNo ? `<div style="font-size:11px;color:var(--muted);">BILL: ${escapeHtml(l.billNo)}</div>` : ''}</td><td>${escapeHtml(l.name)}</td><td>${escapeHtml(l.itemName)}</td><td>${fmtMoney(l.amount)}</td><td><span class="tag ${l.status === 'active' ? 'tag-active' : 'tag-closed'}">${escapeHtml(l.status)}</span></td><td>${fmtDate(l.startDate)}</td><td>${l.closeDate ? fmtDate(l.closeDate) : '-'}</td></tr>`).join('')}
    </tbody></table></div>`}</div>`;
    }
    function setYearFilter(v) { state.yearFilter = Number(v); render(); }

    function downloadYearCsv(yr) {
      const yearLoans = userLoans().filter(l => financialYearOf(l.startDate) === yr || (l.status === 'closed' && l.closeDate && financialYearOf(l.closeDate) === yr));
      const header = ['Loan ID', 'BILL NO', 'Name', 'City', 'Mobile', 'Address', 'Item Name', 'Item Code', 'Weight(gram)', 'Principal', 'Rate(%/mo)', 'Start Date', 'Status', 'Close Date', 'Interest', 'Total Payable', 'Created By'];
      const rows = yearLoans.map(l => [
        l.id, l.billNo || '', l.name, l.city, l.mobile, l.address, l.itemName, l.itemCode, l.weight, l.amount, l.rate,
        fmtDateTime(l.startDate), l.status, l.closeDate ? fmtDateTime(l.closeDate) : '', l.interest || '', l.totalPayable || '', l.createdBy || ''
      ]);
      const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `ND-Finance-${financialYearLabel(yr)}-data.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast(`Financial year ${financialYearLabel(yr)} data downloaded.`);
    }

    function renderAllDataScreen() {
      const loans = userLoans();
      return `<h2 class="page-title">All Data</h2><p class="page-sub">Complete loan history.</p><div class="stat-grid"><div class="stat-box"><div class="n">${loans.length}</div><div class="l">ALL LOANS</div></div><div class="stat-box"><div class="n">${fmtMoney(loans.reduce((s, l) => s + Number(l.amount || 0), 0))}</div><div class="l">ALL PRINCIPAL</div></div></div>${renderYearlyLoanGroup('All Loan Records', loans, 'No loan records found.')}`;
    }

    /* ================= PROFILE MODAL ================= */
    function openProfileModal() { state.showProfileModal = true; state.sidebarOpen = false; render(); }
    function closeProfileModal() { state.showProfileModal = false; render(); }

    function renderProfileModal() {
      if (!state.showProfileModal) return '';
      const s = state.shop;
      return `
  <div class="modal-back show" onclick="if(event.target===this) closeProfileModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeProfileModal()">✕</button>
      <h3>Admin / Shop Profile</h3>
      <div class="logo-upload">
        ${sanitizeImageSrc(s.logo) ? `<img class="logo-preview" id="logo_preview" src="${sanitizeImageSrc(s.logo)}" alt="Shop logo">` : `<div class="shop-logo-ph" id="logo_preview" style="width:56px;height:56px;">🏪</div>`}
        <div>
          <input type="file" accept="image/*" id="logo_file" onchange="onLogoChange(event)">
        </div>
      </div>
      <div class="field"><label>Shop Name</label><input id="pf_name" type="text" value="${escapeAttr(s.name)}"></div>
      <div class="field"><label>Shop Owner Name</label><input id="pf_owner_name" type="text" value="${escapeAttr(s.ownerName || state.currentUser.ownerName || '')}"></div>
      <div class="field"><label>Mobile Number</label><input id="pf_mobile" type="text" value="${escapeAttr(s.mobile)}"></div>
      <div class="field"><label>Verified account email</label><input id="pf_email" type="email" value="${escapeAttr(state.currentUser.email || '')}" disabled></div>
      <p class="page-sub">Email changes require verification and cannot be edited from this profile screen.</p>
      <div class="field"><label>City</label><input id="pf_city" type="text" value="${escapeAttr(s.city)}"></div>
      <button class="btn-gold" id="pf_save_btn" onclick="saveProfile()">Save Profile</button>
    </div>
  </div>`;
    }

    function onLogoChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        state.__pendingLogo = ev.target.result;
        const safe = sanitizeImageSrc(ev.target.result);
        if (safe) {
          const prev = document.getElementById('logo_preview');
          if (prev) {
            prev.outerHTML = `<img class="logo-preview" id="logo_preview" src="${safe}" alt="Shop logo preview">`;
          }
        }
      };
      reader.readAsDataURL(file);
    }

    async function saveProfile() {
      const btn = document.getElementById('pf_save_btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
      state.shop.name = val('pf_name');
      state.shop.ownerName = val('pf_owner_name');
      state.shop.mobile = val('pf_mobile');
      state.shop.city = val('pf_city');
      if (state.__pendingLogo) { state.shop.logo = state.__pendingLogo; state.__pendingLogo = null; }
      try {
        const result = await apiRequest('/api/auth/profile', {
          method: 'PUT',
          body: JSON.stringify({
            shopName: state.shop.name, ownerName: state.shop.ownerName,
            shopLogo: state.shop.logo, mobile: state.shop.mobile, city: state.shop.city
          })
        });
        state.currentUser = result.user;
        state.users = state.users.map(user => user.username === result.user.username ? result.user : user);
        state.shop = shopForUser(result.user);
      } catch (error) {
        toast(`Could not save profile: ${error.message}`);
        if (btn) { btn.disabled = false; btn.textContent = 'Save Profile'; }
        return;
      }
      toast('Shop profile saved.');
      state.showProfileModal = false;
      render();
    }

    /* ================= SETTINGS MODAL ================= */
    function openSettingsModal() { state.showSettingsModal = true; state.sidebarOpen = false; render(); }
    function closeSettingsModal() { state.showSettingsModal = false; render(); }

    function renderSettingsModal() {
      if (!state.showSettingsModal) return '';
      return `
  <div class="modal-back show" onclick="if(event.target===this) closeSettingsModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeSettingsModal()">✕</button>
      <h3>Security Settings</h3>
      <p class="page-sub">Signed in as ${escapeHtml(state.currentUser.username)}. Passwords are hashed on the server.</p>
      <div class="field"><label>New Password (12 characters minimum)</label><input id="st_pass" type="password" autocomplete="new-password" placeholder="Leave blank to keep current"></div>
      <div class="field"><label>Current Password</label><input id="st_curpass" type="password" autocomplete="current-password" placeholder="Required to change password"></div>
      <div class="auth-err" id="st_err"></div>
      <button class="btn-gold" onclick="saveSettings()">Change Password</button>
      <hr>
      <h3>Two-factor authentication</h3>
      <p class="page-sub">${state.mfaEnabled ? 'Authenticator app verification is enabled.' : 'Add an authenticator app as a second sign-in step.'}</p>
      ${state.pendingMfaSecret
          ? `<div class="auth-msg">Add this key to your authenticator app: <strong>${escapeHtml(state.pendingMfaSecret)}</strong></div>
      <div class="field"><label>Authenticator code to confirm setup</label><input id="st_mfa_code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
      <button class="btn-gold" onclick="enableMfa()">Confirm and enable MFA</button>
      <button class="btn btn-ghost btn-outline-full" onclick="state.pendingMfaSecret='';render()">Cancel setup</button>`
          : state.mfaEnabled
            ? `<div class="field"><label>Current password</label><input id="st_mfa_password" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Authenticator code</label><input id="st_mfa_code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
      <button class="btn-outline" onclick="disableMfa()">Disable MFA</button>`
            : `<button class="btn-outline" onclick="setupMfa()">Set up authenticator app</button>`}
    </div>
  </div>`;
    }

    async function saveSettings() {
      const newPass = val('st_pass');
      const curPass = val('st_curpass');
      const errEl = document.getElementById('st_err');
      if (!newPass) { closeSettingsModal(); return; }
      try {
        await apiRequest('/api/auth/password/change', {
          method: 'POST', body: JSON.stringify({ currentPassword: curPass, newPassword: newPass })
        });
        await loadAll();
        toast('Password updated. Other active sessions were signed out.');
        state.showSettingsModal = false;
        render();
      } catch (error) {
        errEl.textContent = error.message;
      }
    }

    async function setupMfa() {
      try {
        const result = await apiRequest('/api/auth/mfa/setup', { method: 'POST' });
        state.pendingMfaSecret = result.secret;
        render();
      } catch (error) {
        toast(`Could not start MFA setup: ${error.message}`);
      }
    }

    async function enableMfa() {
      const code = val('st_mfa_code');
      try {
        await apiRequest('/api/auth/mfa/enable', { method: 'POST', body: JSON.stringify({ code }) });
        state.mfaEnabled = true;
        state.pendingMfaSecret = '';
        toast('Two-factor authentication enabled.');
        render();
      } catch (error) { document.getElementById('st_err').textContent = error.message; }
    }

    async function disableMfa() {
      try {
        await apiRequest('/api/auth/mfa/disable', {
          method: 'POST',
          body: JSON.stringify({ password: val('st_mfa_password'), code: val('st_mfa_code') })
        });
        state.mfaEnabled = false;
        toast('Two-factor authentication disabled.');
        render();
      } catch (error) { document.getElementById('st_err').textContent = error.message; }
    }

    /* ================= UTIL ================= */
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function escapeAttr(s) { return escapeHtml(s); }
    function escapeAttrJs(s) {
      const jsEscaped = String(s ?? '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '\\r')
        .replace(/\u2028/g, '\\u2028')
        .replace(/\u2029/g, '\\u2029');
      return escapeHtml(jsEscaped);
    }
    function sanitizeImageSrc(src) {
      if (!src || typeof src !== 'string') return '';
      const trimmed = src.trim();
      if (/^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+/=]+$/i.test(trimmed) ||
        /^https?:\/\/[^\s"'<>]+$/i.test(trimmed)) {
        return escapeAttr(trimmed);
      }
      return '';
    }
    function formatAadhaarMasked(v) {
      const s = String(v || '').replace(/\D/g, '');
      if (s.length === 12) {
        return `XXXX-XXXX-${s.slice(8)}`;
      }
      if (s.length > 4) {
        return `XXXX-${s.slice(-4)}`;
      }
      return s ? `XXXX-${s}` : '-';
    }
    function refocus(id) { setTimeout(() => { const el = document.getElementById(id); if (el) { el.focus(); const v = el.value; el.value = ''; el.value = v; } }, 0); }

    function showLocalLaunchInstructions() {
      state.authError = 'ND Finance is starting. Wait a moment for http://localhost:5080, or run start-nd-finance.bat from the workspace folder. Opening this file directly cannot start the database server.';
      render();
    }

    /* ================= INIT ================= */
    if (window.location.protocol === 'file:') {
      (async function openLocalWebsite() {
        const appUrl = 'http://localhost:5080/';
        for (let attempt = 0; attempt < 30; attempt++) {
          try {
            await fetch(`${appUrl}api/health`, { mode: 'no-cors', cache: 'no-store' });
            window.location.replace(appUrl);
            return;
          } catch (_) {
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
        }
        showLocalLaunchInstructions();
      })();
    } else {
      loadAll();
    }
  </script>
</body>

</html>
